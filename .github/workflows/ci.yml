name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Run Unit Tests
      run: |
        PYTHONPATH=src python3 -m unittest discover tests/ -v

    - name: Run Day 4 Evaluation Suite
      run: |
        python3 evals/evaluate_quality.py

    - name: Test CLI Interface
      run: |
        PYTHONPATH=src python3 -m strava_health_agent.cli demo --scenario danger_spike
        PYTHONPATH=src python3 -m strava_health_agent.cli demo --scenario optimal_build
        PYTHONPATH=src python3 -m strava_health_agent.cli demo --scenario taper_freshness
        PYTHONPATH=src python3 -m strava_health_agent.cli metrics --scenario danger_spike
